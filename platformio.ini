; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F103C8

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
lib_deps =
    simsso/ShiftRegister74HC595 @ ^1.3.1
    cmb27/ModbusRTUSlave
upload_protocol = stlink
monitor_speed = 9600
debug_tool = stlink
monitor_echo = yes
monitor_eol = CRLF
monitor_filters = send_on_enter
; 4 KB cuoi flash danh rieng cho lich va dien nang (2 cap trang 1 KB).
board_upload.maximum_size = 61440
build_flags =
  -DENABLE_HWSERIAL1
  -DENABLE_HWSERIAL3
  ; Serial2 duoc core tu bat vi SERIAL_UART_INSTANCE=2.
  -DUSE_HSI_CLOCK
  -DSERIAL_RX_BUFFER_SIZE=1024
  -DI2C_TIMEOUT_TICK=10
upload_flags =
  -c
  reset_config none

